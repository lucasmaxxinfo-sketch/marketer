name: Build Marketing Genius Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'cinematic-finish.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'kira-avatar-3d.js'
      - 'cosmic-background.js'
      - 'kira-portrait-data.js'
      - 'kira-voice.js'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate app metadata
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
          grep -q 'kira-portrait-data.js' index.html
          grep -q 'cosmic-background.js' index.html
          grep -q 'kira-voice.js' index.html

      - name: Prepare Android web assets
        run: |
          mkdir -p mobile/www
          cp index.html app.js styles.css cinematic-finish.css manifest.webmanifest icon.svg sw.js kira-avatar-3d.js cosmic-background.js kira-portrait-data.js kira-voice.js mobile/www/
          for file in app.js kira-avatar-3d.js cosmic-background.js kira-portrait-data.js kira-voice.js; do node --check "mobile/www/$file"; done

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync app into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Lock Android activity to portrait
        working-directory: mobile/android
        run: sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' app/src/main/AndroidManifest.xml

      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Marketing Genius Android build ${{ github.run_number }}
          body: |
            Automatically built Android APK for Marketing Genius Command Centre.

            This is a debug-signed installable APK for testing. Install only on a device you control.
            Campaign data remains on the device unless the app is connected to a configured backend.
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
