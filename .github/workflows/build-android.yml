name: Build Marketing Genius Android APK

on:
  push:
    branches: [main, fix/kira-animated-presence-voice]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'cinematic-finish.css'
      - 'ux-refinements.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'kira-avatar-3d.js'
      - 'cosmic-background.js'
      - 'native-speech.js'
      - 'mobile/native-speech-entry.js'
      - 'kira-voice.js'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate app metadata
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
          grep -q 'native-speech.js' index.html
          node -e "const p=require('./mobile/package.json'); if(!p.dependencies['@capacitor-community/speech-recognition']) process.exit(1)"
          grep -q 'cosmic-background.js' index.html
          grep -q 'kira-voice.js' index.html
          node mobile/scripts/check-kira-experience.mjs

      - name: Prepare Android web assets
        run: |
          mkdir -p mobile/www
          cp index.html app.js styles.css cinematic-finish.css ux-refinements.css manifest.webmanifest icon.svg sw.js kira-avatar-3d.js cosmic-background.js native-speech.js kira-voice.js mobile/www/
          for file in app.js kira-avatar-3d.js cosmic-background.js native-speech.js kira-voice.js; do node --check "mobile/www/$file"; done

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Bundle native speech bridge
        working-directory: mobile
        run: |
          npm run build:web-bridge
          node --check www/native-speech.js

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync app into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Configure Android HTTPS trust for private LAN certificate
        working-directory: mobile
        run: node scripts/configure-android-security.mjs

      - name: Verify Android HTTPS trust configuration
        working-directory: mobile
        run: node scripts/check-android-security.mjs

      - name: Lock Android activity to portrait
        working-directory: mobile/android
        run: sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' app/src/main/AndroidManifest.xml

      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify packaged voice permissions
        working-directory: mobile/android
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk > /tmp/kira-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/kira-permissions.txt
          if grep -q 'android.permission.CAMERA' /tmp/kira-permissions.txt; then
            echo "Kira voice chat must not request camera permission."
            exit 1
          fi

      - name: Verify APK on an Android virtual device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb wait-for-device
            package_manager_ready=false
            for attempt in $(seq 1 60); do
              if adb shell cmd package list packages >/dev/null 2>&1; then
                package_manager_ready=true
                break
              fi
              echo "Waiting for Android Package Manager ($attempt/60)"
              sleep 2
            done
            if [ "$package_manager_ready" != true ]; then
              adb shell getprop sys.boot_completed || true
              adb shell service list || true
              echo "Android Package Manager did not become ready after emulator boot."
              exit 1
            fi
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.marketinggenius.commandcentre
            adb shell am force-stop com.marketinggenius.commandcentre || true
            adb shell monkey -p com.marketinggenius.commandcentre -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 30); do
              if adb shell pidof com.marketinggenius.commandcentre >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            adb shell pidof com.marketinggenius.commandcentre
            adb shell dumpsys activity activities | grep -q 'com.marketinggenius.commandcentre'
            adb shell screencap -p /sdcard/marketing-genius-virtual-device.png
            adb pull /sdcard/marketing-genius-virtual-device.png marketing-genius-virtual-device.png
            test -s marketing-genius-virtual-device.png

      - name: Upload Android virtual-device screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-genius-android-virtual-device
          path: marketing-genius-virtual-device.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish APK as a GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Marketing Genius Android build ${{ github.run_number }}
          body: |
            Automatically built Android APK for Marketing Genius Command Centre.

            This is a debug-signed installable APK for testing. Install only on a device you control.
            Campaign data remains on the device unless the app is connected to a configured backend.
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
