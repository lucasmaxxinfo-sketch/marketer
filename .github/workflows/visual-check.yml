name: Temporary visual verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture live mobile view
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('https://lucasmaxxinfo-sketch.github.io/marketer/?visualcheck=1',{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(2500);
          await page.screenshot({path:'/tmp/mobile.jpg',type:'jpeg',quality:52,fullPage:false});
          const result=await page.evaluate(()=>({title:document.title,viewport:{width:innerWidth,height:innerHeight},document:{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight},body:{width:document.body.scrollWidth,height:document.body.scrollHeight},world:!!document.querySelector('.kira-world'),clouds:document.querySelectorAll('.kira-world .cloud').length,avatar:document.querySelector('.kira-avatar')?.getAttribute('aria-label')||null,headline:document.querySelector('.kira-world h1')?.innerText||null,buttons:[...document.querySelectorAll('.kira-world-actions button')].map(x=>x.innerText),font:getComputedStyle(document.querySelector('.kira-world h1')||document.body).fontFamily}));
          console.log('VISUAL_CHECK_RESULT='+JSON.stringify({...result,pageErrors:errors}));
          await browser.close();
          NODE
          base64 -w0 /tmp/mobile.jpg > visual-check-mobile.txt
      - name: Store screenshot temporarily for inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-check-mobile.txt
          git commit -m "Temporary visual verification screenshot"
          git push
