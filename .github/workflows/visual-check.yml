name: App browser verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-check.yml'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test deployed app on mobile and desktop
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const failures=[];
          for (const viewport of [{width:390,height:844,isMobile:true},{width:1365,height:900,isMobile:false}]) {
            const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1,isMobile:viewport.isMobile,hasTouch:viewport.isMobile});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://lucasmaxxinfo-sketch.github.io/marketer/?check='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            let state=await page.evaluate(()=>({world:!!document.querySelector('.kira-world'),width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight,viewportWidth:innerWidth,viewportHeight:innerHeight,clouds:document.querySelectorAll('.kira-world .cloud').length,headline:document.querySelector('.kira-world h1')?.innerText,buttons:[...document.querySelectorAll('.kira-world-actions button')].map(b=>b.innerText)}));
            if(!state.world||state.clouds!==3||state.width>state.viewportWidth||state.height>state.viewportHeight||errors.length) failures.push({viewport,state,errors});
            await page.locator('.kira-world-actions [data-view="approvals"]').click();
            if(!(await page.locator('#view-root').innerText()).trim()) failures.push({viewport,view:'approvals',error:'empty view'});
            for(const view of ['studio','schedule','results','connections','settings','dashboard']){
              if(view==='dashboard') {
                await page.locator('[data-action="kira-home"]').click().catch(async()=>{await page.locator('#menu-toggle').click();await page.locator('.sidebar [data-view="dashboard"]').click()});
              } else {
                await page.locator('#menu-toggle').click();
                await page.locator('.sidebar [data-view="'+view+'"]').first().click();
              }
              await page.waitForTimeout(120);
              const rendered=await page.locator('#view-root').innerText();
              if(!rendered.trim()) failures.push({viewport,view,error:'empty view'});
            }
            await page.locator('#sound-toggle').click();
            const sound=await page.locator('#sound-toggle').getAttribute('aria-pressed');
            if(sound!=='true') failures.push({viewport,error:'sound toggle did not enable',sound});
            await page.locator('#sound-toggle').click();
            await page.locator('#menu-toggle').click();
            const menu=await page.locator('.sidebar').getAttribute('class');
            if(!menu.includes('menu-open')) failures.push({viewport,error:'menu did not open',menu});
            await page.locator('#menu-toggle').click();
            console.log('VIEWPORT_RESULT='+JSON.stringify({viewport,state,errors,sound,menu}));
            await page.close();
          }
          await browser.close();
          if(failures.length){console.error('BROWSER_TEST_FAILURES='+JSON.stringify(failures));process.exit(1)}
          console.log('ALL_BROWSER_CHECKS_PASSED');
          NODE
