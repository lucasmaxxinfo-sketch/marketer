name: App browser verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-check.yml'
      - 'app.js'
      - 'styles.css'
      - 'cinematic-finish.css'
      - 'ux-refinements.css'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test current commit on mobile and desktop
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { extname, join, normalize } from 'node:path';
          const root=process.cwd();
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.svg':'image/svg+xml','.json':'application/json','.webmanifest':'application/manifest+json'};
          const server=createServer(async(req,res)=>{
            const pathname=decodeURIComponent(new URL(req.url,'http://127.0.0.1').pathname);
            const file=normalize(join(root,pathname==='/'?'index.html':pathname.slice(1)));
            if(!file.startsWith(root)){res.writeHead(403).end();return}
            try{const body=await readFile(file);res.writeHead(200,{'content-type':mime[extname(file)]||'application/octet-stream','cache-control':'no-store'}).end(body)}
            catch{res.writeHead(404).end('Not found')}
          });
          await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
          const browser = await chromium.launch({headless:true});
          const failures=[];
          for (const viewport of [{width:390,height:844,isMobile:true},{width:1365,height:900,isMobile:false}]) {
            const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1,isMobile:viewport.isMobile,hasTouch:viewport.isMobile});
            await page.addInitScript(()=>localStorage.setItem('mgcc-v1',JSON.stringify({campaigns:[{id:'campaign-evidence-test',name:'Research-backed test',offer:'A test offer',status:'pending',goal:'awareness',angle:'community',audience:'Test audience',expected:{reach:'',engagementRate:''},posts:[{id:'post-evidence-test',title:'Evidence test post',copy:'Test campaign copy',status:'pending',scheduledDate:'',platform:'Facebook'}],researchEvidence:[{label:'Trusted source',url:'https://example.com/report',observedAt:'2026-11-06T10:00:00.000Z'},{label:'Unsafe source',url:'javascript:alert(1)'}]}],operations:[{id:'research-op-test',type:'opportunity_assessment',title:'Test opportunity',summary:'A grounded opportunity',status:'awaiting_owner',priority:'high',result:'Research report',evidence:[],updatedAt:new Date().toISOString(),history:[{status:'queued',at:new Date().toISOString(),by:'kira',note:'Kira opened the research task.'},{status:'awaiting_owner',at:new Date().toISOString(),by:'kira',note:'Research report saved with sources.'}]},{id:'op-queued-test',type:'research',title:'Queued check',summary:'A queued test operation',status:'queued',priority:'normal',updatedAt:new Date().toISOString()},{id:'op-progress-test',type:'campaign_preparation',title:'Active preparation',summary:'A work item currently marked in progress',status:'in_progress',priority:'normal',updatedAt:new Date().toISOString()},{id:'op-blocked-test',type:'publishing',title:'Blocked publishing',summary:'A publishing dependency is missing',status:'blocked',blocker:'Meta account access has not been configured.',priority:'high',updatedAt:new Date().toISOString()},{id:'op-blocked-research-test',type:'opportunity_assessment',title:'Blocked research retry gate',summary:'Research task requiring an owner session before retry.',status:'blocked',blocker:'Previous provider request timed out.',priority:'high',updatedAt:new Date().toISOString()},{id:'op-complete-test',type:'quality_review',title:'Completed quality review',summary:'A finished quality check',status:'completed',result:'All supplied copy passed the seeded test.',priority:'normal',updatedAt:new Date().toISOString()}],settings:{business:'Test business'}})));
            const errors=[];
            page.setDefaultTimeout(8000);
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/?check='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            let state=await page.evaluate(()=>{
              const image=document.querySelector('.kira-avatar-photo img');
              return {world:!!document.querySelector('.kira-world'),width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight,viewportWidth:innerWidth,viewportHeight:innerHeight,clouds:document.querySelectorAll('.kira-world .cloud').length,headline:document.querySelector('.kira-world h1')?.innerText,buttons:[...document.querySelectorAll('.kira-world-actions button')].map(b=>b.innerText),dimensionCanvas:!!document.querySelector('#kira-dimension-canvas'),portals:document.querySelectorAll('.dimension-portal').length,threeRevision:window.THREE?.REVISION||null,kiraPortrait:!!image&&image.complete&&image.naturalWidth>0&&image.naturalHeight>0};
            });
            if(!state.world||state.clouds!==3||!state.dimensionCanvas||state.portals!==5||!state.threeRevision||!state.kiraPortrait||state.width>state.viewportWidth||errors.length) failures.push({viewport,state,errors});
            await page.keyboard.press('Tab');
            const skipLink=await page.evaluate(()=>({focused:document.activeElement?.classList.contains('skip-link'),top:document.activeElement?.getBoundingClientRect().top}));
            if(!skipLink.focused||skipLink.top<0) failures.push({viewport,error:'skip link is not visible on keyboard focus',skipLink});
            await page.emulateMedia({reducedMotion:'reduce'});
            const motion=await page.locator('.kira-world').evaluate(el=>getComputedStyle(el).animationName);
            if(motion!=='none') failures.push({viewport,error:'reduced-motion preference is not respected',motion});
            await page.emulateMedia({reducedMotion:'no-preference'});
            await page.locator('.kira-world-actions [data-view="approvals"]').click();
            if(!(await page.locator('#view-root').innerText()).trim()) failures.push({viewport,view:'approvals',error:'empty view'});
            for(const view of ['operations','studio','schedule','results','connections','settings','dashboard']){
              console.log('NAVIGATION_CHECK_START='+viewport.width+':'+view);
              if(view!=='dashboard'){
                if(!(await page.locator('.kira-world').count())) await page.locator('[data-action="kira-home"]').click();
                const sidebarClass=await page.locator('.sidebar').getAttribute('class')||'';
                if(!sidebarClass.includes('menu-open')){
                  const menuToggle=page.locator('#menu-toggle');
                  if(await menuToggle.isVisible()) await menuToggle.click();
                  else await page.locator('.world-menu-link').click();
                }
                await page.locator('.sidebar [data-view="'+view+'"]').first().click();
              } else if(!(await page.locator('.kira-world').count())) {
                await page.locator('[data-action="kira-home"]').click();
              }
              await page.waitForTimeout(120);
              const rendered=await page.locator('#view-root').innerText();
              if(!rendered.trim()) failures.push({viewport,view,error:'empty view'});
              if(view==='operations'){
                const cards=page.locator('#view-root .operation-card');
                const statuses=await page.locator('#view-root .operation-state').allInnerTexts();
                const blocker=await page.locator('#view-root .operation-blocker').innerText();
                const decisionAction=await page.locator('#view-root [data-action="develop-opportunity"]').count();
                if(await cards.count()!==5||!statuses.includes('Queued')||!statuses.includes('In progress')||!statuses.includes('Your decision needed')||!statuses.includes('Blocked')||!statuses.includes('Completed')) failures.push({viewport,view,error:'operation status distinctions missing',statuses,count:await cards.count()});
                if(!blocker.includes('Meta account access has not been configured.')) failures.push({viewport,view,error:'blocked operation does not explain its dependency',blocker});
                if(decisionAction!==1) failures.push({viewport,view,error:'owner handoff action should appear only on the eligible awaiting-owner opportunity',decisionAction});
                if(!(await page.locator('#view-root').innerText()).includes('Completed result')) failures.push({viewport,view,error:'completed work result is not labelled clearly'});
                const history=page.locator('#view-root [data-operation-id="research-op-test"] .operation-history');
                if(await history.count()!==1||!(await history.locator('summary').innerText()).includes('Work history (2)')) failures.push({viewport,view,error:'operation audit history disclosure is missing'});
                else {await history.locator('summary').click();const historyText=await history.innerText();if(!historyText.includes('Kira')||!historyText.includes('Kira opened the research task.')) failures.push({viewport,view,error:'operation audit history is not attributable',historyText});}

              }
              if(view==='approvals'){
                const filters=page.locator('#view-root [data-filter]');
                const filterState=await filters.evaluateAll(nodes=>nodes.map(n=>({label:n.innerText.trim(),pressed:n.getAttribute('aria-pressed')})));
                if(filterState.length!==3||filterState[0].label!=='All 1'||filterState[1].label!=='Pending 1'||filterState[2].label!=='Sent back 0'||filterState[0].pressed!=='true') failures.push({viewport,view,error:'decision queue counts or accessible filter state incorrect',filterState});
                await page.locator('#view-root [data-filter="Sent back"]').click();
                if(!(await page.locator('#view-root').innerText()).includes('Nothing sent back')) failures.push({viewport,view,error:'empty filtered queue message is not specific'});
                await page.locator('#view-root [data-filter="All"]').click();
                const queueCard=page.locator('#view-root .campaign-card[data-campaign-id="campaign-evidence-test"]');
                const reviewAction=queueCard.locator('[data-action="review"][data-id="campaign-evidence-test"]');
                const quickApprove=queueCard.locator('[data-action="approve-campaign"]');
                const quickReject=queueCard.locator('[data-action="reject"]');
                if(await reviewAction.count()!==1||await quickApprove.count()!==0||await quickReject.count()!==0) failures.push({viewport,view,error:'decision queue must require campaign inspection before approval or send-back'});
                else {
                  await reviewAction.click();
                  const inReviewApprove=page.locator('#view-root [data-action="approve-campaign"][data-id="campaign-evidence-test"]');
                  const inReviewReject=page.locator('#view-root [data-action="reject"][data-id="campaign-evidence-test"]');
                  if(await inReviewApprove.count()!==1||await inReviewReject.count()!==1) failures.push({viewport,view,error:'review screen must provide both owner decisions'});
                  await page.locator('#view-root [data-action="close-review"]').click();
                }
              }
              if(view==='studio'){
                const reviewButton=page.locator('[data-action="review"][data-id="campaign-evidence-test"]');
                if(await reviewButton.count()!==1) failures.push({viewport,view,error:'seeded research-backed campaign missing'});
                else {
                  await reviewButton.click();
                  const evidencePanel=page.locator('#view-root .report-note').filter({hasText:'Research behind this draft'});
                  const trustedLink=evidencePanel.locator('a[href="https://example.com/report"]');
                  const unsafeLink=page.locator('#view-root a[href^="javascript:"]');
                  if(await evidencePanel.count()!==1||await trustedLink.count()!==1||await unsafeLink.count()!==0) failures.push({viewport,view,error:'campaign research evidence was not safely displayed',panelCount:await evidencePanel.count(),trustedLinkCount:await trustedLink.count(),unsafeLinkCount:await unsafeLink.count()});
                  const reviewHeading=page.locator('#view-root .campaign-review h2');
                  const copyField=page.locator('#view-root textarea[data-copy="post-evidence-test"]');
                  const saveButton=page.locator('#view-root [data-action="save-review"][data-id="campaign-evidence-test"]');
                  if(await reviewHeading.innerText()!=='Research-backed test'||await copyField.count()!==1||await saveButton.count()!==1) failures.push({viewport,view,error:'campaign review layout or edit controls missing'});
                  else {
                    await copyField.fill('Updated campaign copy from browser regression test');
                    await saveButton.click();
                    await page.waitForTimeout(100);
                    const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('mgcc-v1')||'{}').campaigns?.find(c=>c.id==='campaign-evidence-test')?.posts?.[0]?.copy);
                    if(saved!=='Updated campaign copy from browser regression test') failures.push({viewport,view,error:'campaign review edits were not persisted',saved});
                    if(!(await page.locator('#toast').innerText()).includes('Campaign changes saved')) failures.push({viewport,view,error:'save confirmation missing'});
                  }
                }
              }
              if(view==='operations'){
                const researchButton=page.locator('[data-action="operations-research"]');
                if(await researchButton.count()!==1) failures.push({viewport,view,error:'research action missing'});
                else {await researchButton.click();const notice=await page.locator('#toast').innerText();if(!notice.includes('Connect and sign in'))failures.push({viewport,view,error:'research action did not explain live connection requirement',notice});}
                const retryButton=page.locator('[data-action="retry-research"]');
                if(await retryButton.count()!==0) failures.push({viewport,view,error:'blocked research retry bypassed the signed-in session gate'});
                const blockedResearch=page.locator('[data-operation-id="op-blocked-research-test"] .operation-blocker');
                if(await blockedResearch.count()!==1||!(await blockedResearch.innerText()).includes('Previous provider request timed out')) failures.push({viewport,view,error:'blocked research dependency was not displayed'});
                const blockedPublishing=page.locator('[data-operation-id="op-blocked-test"] [data-action="retry-research"]');
                if(await blockedPublishing.count()!==0) failures.push({viewport,view,error:'unsupported publishing retry action was exposed'});
                const developButton=page.locator('[data-action="develop-opportunity"]');
                if(await developButton.count()!==1) failures.push({viewport,view,error:'selected opportunity campaign action missing'});
                else {await developButton.click();const notice=await page.locator('#toast').innerText();if(!notice.includes('Sign in to the live workspace'))failures.push({viewport,view,error:'campaign handoff did not enforce live owner session',notice});}
              }
              if(view==='settings'){
                if(await page.locator('input[name="businessLocation"]').count()!==1) failures.push({viewport,view,error:'business location field missing'});

                const privacyVisible=rendered.includes('Privacy & data')&&rendered.includes('OpenAI')&&rendered.includes('Clear device data');
                const exportVisible=await page.locator('[data-action="export-data"]').count()===1;
                const clearVisible=await page.locator('[data-action="reset-data"]').count()===1;
                const cloudDeleteHidden=await page.locator('[data-action="delete-cloud-data"]').count()===0;
                const operationDeleteHidden=await page.locator('[data-action="delete-cloud-operations"]').count()===0;
                const locationField=await page.locator('input[name="businessLocation"]').count()===1;
                const researchDisclosure=rendered.includes('Live research also uses OpenAI web search')&&rendered.includes('research reports');
                if(!privacyVisible||!exportVisible||!clearVisible||!cloudDeleteHidden||!operationDeleteHidden||!locationField||!researchDisclosure) failures.push({viewport,view,error:'privacy and data controls are incomplete',privacyVisible,exportVisible,clearVisible,cloudDeleteHidden,operationDeleteHidden,locationField,researchDisclosure});
                const downloadPromise=page.waitForEvent('download');
                await page.locator('[data-action="export-data"]').click();
                const download=await downloadPromise;
                if(download.suggestedFilename()!=='marketing-genius-data.json') failures.push({viewport,view,error:'data export did not produce the expected file',filename:download.suggestedFilename()});
              }
            }
            await page.locator('#sound-toggle').click();
            const sound=await page.locator('#sound-toggle').getAttribute('aria-pressed');
            if(sound!=='true') failures.push({viewport,error:'sound toggle did not enable',sound});
            await page.locator('#sound-toggle').click();
            if(!(await page.locator('.kira-world').count())) await page.locator('[data-action="kira-home"]').click();
            const menuToggle=page.locator('#menu-toggle');
            const menuBefore=await page.locator('.sidebar').getAttribute('class')||'';
            if(!menuBefore.includes('menu-open')){
              if(await menuToggle.isVisible()) await menuToggle.click();
              else await page.locator('.world-menu-link').click();
            }
            const menu=await page.locator('.sidebar').getAttribute('class')||'';
            if(!menu.includes('menu-open')) failures.push({viewport,error:'menu did not open',menu});
            if(viewport.isMobile){
              const backdropVisible=await page.locator('.nav-backdrop').isVisible();
              if(!backdropVisible) failures.push({viewport,error:'mobile drawer backdrop is not visible'});
              else await page.locator('.nav-backdrop').click({position:{x:viewport.width-16,y:Math.min(300,viewport.height-100)}});
              const closed=!(await page.locator('.sidebar').getAttribute('class')||'').includes('menu-open');
              if(!closed) failures.push({viewport,error:'outside tap did not close mobile navigation'});
            } else if(await menuToggle.isVisible()) await menuToggle.click();
            else await page.locator('.world-menu-link').click();
            console.log('VIEWPORT_RESULT='+JSON.stringify({viewport,state,errors,sound,menu}));
            await page.close();
          }
          await browser.close();
          await new Promise(resolve=>server.close(resolve));
          if(failures.length){console.error('BROWSER_TEST_FAILURES='+JSON.stringify(failures));process.exit(1)}
          console.log('ALL_BROWSER_CHECKS_PASSED');
          NODE
