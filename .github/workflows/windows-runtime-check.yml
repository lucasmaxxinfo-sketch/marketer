name: Windows local runtime compatibility

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'mobile/**'
      - 'scripts/**'
      - 'docs/WINDOWS-ANDROID-LAN-SETUP.md'
      - 'app.js'
      - 'kira-voice.js'
      - 'kira-avatar-3d.js'
      - '.github/workflows/windows-runtime-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'scripts/**'
      - 'docs/WINDOWS-ANDROID-LAN-SETUP.md'
      - 'app.js'
      - 'kira-voice.js'
      - 'kira-avatar-3d.js'
      - '.github/workflows/windows-runtime-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    name: Test local API and installer on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check app.js
          node --check kira-voice.js
          node --check kira-avatar-3d.js
          node --check backend/worker.js
          node --check backend/local/server.mjs
          node --check backend/local/install.mjs
          node --check mobile/native-speech-entry.js
          node --check mobile/scripts/configure-android-security.mjs
          node --check mobile/scripts/check-kira-experience.mjs
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/setup-windows-lan.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Run backend, SQLite and installer tests on Windows
        shell: pwsh
        run: |
          node --test backend/worker.test.mjs backend/business-workspace.test.mjs backend/local/server.test.mjs backend/local/install.test.mjs

      - name: Verify Android voice and private HTTPS configuration
        shell: pwsh
        run: |
          node mobile/scripts/check-kira-experience.mjs
          Write-Host "Android voice experience checks passed."

      - name: Verify Windows installer entry point and LAN setup documentation
        shell: pwsh
        run: |
          if (-not (Select-String -Path backend/local/install.mjs -Pattern 'process.platform === "win32"' -Quiet)) {
            throw "Installer no longer contains its Windows command handling."
          }
          if (-not (Select-String -Path docs/WINDOWS-ANDROID-LAN-SETUP.md -Pattern 'setup-windows-lan.ps1' -Quiet)) {
            throw "Windows + Android LAN helper instructions are missing."
          }
          if (-not (Select-String -Path scripts/setup-windows-lan.ps1 -Pattern 'New-NetFirewallRule' -Quiet)) {
            throw "LAN helper does not configure the Windows firewall."
          }
          if (-not (Select-String -Path scripts/setup-windows-lan.ps1 -Pattern 'docker compose --profile lan up -d' -Quiet)) {
            throw "LAN helper does not start the HTTPS proxy."
          }
          Write-Host "Windows installer and LAN setup entry points are present."
