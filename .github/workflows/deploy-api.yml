name: Backend checks and optional Cloudflare deployment

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify backend, installer and local stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate backend JavaScript
        run: |
          node --check backend/worker.js
          node --check backend/local/server.mjs
          node --check backend/local/install.mjs
      - name: Test Worker rules, SQLite runtime and installer
        run: node --test backend/worker.test.mjs backend/local/server.test.mjs backend/local/install.test.mjs
      - name: Validate Wrangler deployment configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("backend/wrangler.toml").read_text()
          required = [
              'name = "marketing-genius-api"',
              'main = "worker.js"',
              'binding = "MG_DATA"',
              'id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"',
              'APP_ADDITIONAL_ORIGINS = "https://localhost"',
              'crons = ["0 14 * * *"]',
          ]
          missing = [item for item in required if item not in config]
          if missing:
              raise SystemExit("Wrangler configuration missing: " + ", ".join(missing))
          print("Wrangler Worker, KV, Android origin and daily research configuration verified.")
          PY
      - name: Validate local Docker Compose configuration
        run: |
          touch backend/local/.env
          docker compose config --quiet

  deployment-readiness:
    name: Check optional Cloudflare deployment access
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.credentials.outputs.deployable }}
    steps:
      - name: Check whether deployment credentials are available
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          MG_DATA_KV_ID: ${{ secrets.MG_DATA_KV_ID || vars.MG_DATA_KV_ID }}
          APP_LOGIN_PASSWORD: ${{ secrets.APP_LOGIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MG_DATA_KV_ID APP_LOGIN_PASSWORD SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::warning::Optional Cloudflare deployment is unavailable because Actions did not expose $name."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "Core Cloudflare deployment settings are available."
            if [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "::notice::OPENAI_API_KEY is not configured; the API can deploy, but hosted AI and OpenAI live research will remain unavailable."
            fi
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "Backend verification passed. Cloudflare deployment will be skipped; the self-hosted local runtime is unaffected."
          fi

  deploy-api:
    name: Deploy Cloudflare Worker
    needs: [validate, deployment-readiness]
    if: needs.deployment-readiness.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    env:
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inject private KV namespace ID
        env:
          MG_DATA_KV_ID: ${{ secrets.MG_DATA_KV_ID || vars.MG_DATA_KV_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path("backend/wrangler.toml")
          content = p.read_text()
          placeholder = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
          if placeholder not in content:
              raise SystemExit("Expected KV namespace placeholder was not found.")
          p.write_text(content.replace(placeholder, os.environ["MG_DATA_KV_ID"]))
          PY
      - name: Deploy Worker and configure required secrets
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APP_LOGIN_PASSWORD
            SESSION_SECRET
        env:
          APP_LOGIN_PASSWORD: ${{ secrets.APP_LOGIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Configure OpenAI provider key when supplied
        if: env.OPENAI_API_KEY != ''
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Configure Facebook Page ID when supplied
        if: ${{ env.META_PAGE_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: META_PAGE_ID
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}

      - name: Configure Facebook Page access token when supplied
        if: ${{ env.META_PAGE_ACCESS_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: META_PAGE_ACCESS_TOKEN
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}

      - name: Configure Instagram account ID when supplied
        if: ${{ env.META_INSTAGRAM_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: META_INSTAGRAM_ACCOUNT_ID
        env:
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
