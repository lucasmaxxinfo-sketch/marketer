name: Backend checks and Cloudflare Wrangler deployment

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify backend, installer and local stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate backend JavaScript
        run: |
          node --check backend/worker.js
          node --check backend/local/server.mjs
          node --check backend/local/install.mjs
      - name: Test Worker rules, SQLite runtime and installer
        run: node --test backend/worker.test.mjs backend/business-workspace.test.mjs backend/local/server.test.mjs backend/local/install.test.mjs
      - name: Validate Wrangler deployment configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("backend/wrangler.toml").read_text()
          required = [
              'name = "marketing-genius-api"',
              'main = "worker.js"',
              'binding = "MG_DATA"',
              'id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"',
              'APP_ADDITIONAL_ORIGINS = "https://localhost"',
              'crons = ["0 14 * * *"]',
          ]
          missing = [item for item in required if item not in config]
          if missing:
              raise SystemExit("Wrangler configuration missing: " + ", ".join(missing))
          print("Wrangler Worker, KV, Android origin and daily research configuration verified.")
          PY
      - name: Validate local Docker Compose configuration
        run: |
          touch backend/local/.env
          docker compose config --quiet

  deploy-api:
    name: Deploy Worker using the official open-source Wrangler CLI
    needs: validate
    runs-on: ubuntu-latest
    # Use repository-level Actions secrets directly. Avoid binding this job to a
    # GitHub Environment, which previously caused configured credentials not
    # to be visible to the deployment runner.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      MG_DATA_KV_ID: ${{ secrets.MG_DATA_KV_ID || vars.MG_DATA_KV_ID }}
      APP_LOGIN_PASSWORD: ${{ secrets.APP_LOGIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diagnose deployment credentials without printing values
        id: credentials
        shell: bash
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MG_DATA_KV_ID APP_LOGIN_PASSWORD SESSION_SECRET; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Cloudflare deployment blocked. GitHub Actions did not provide: %s\n' "${missing[*]}"
            echo "Required values must be configured as repository Actions secrets, except account/KV IDs which may be repository variables."
            exit 1
          fi
          echo "All required deployment settings are present."
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::warning::OPENAI_API_KEY is absent. Worker can deploy, but hosted AI and OpenAI live research will be unavailable."
          fi
      - name: Install official Wrangler CLI
        run: npm install --global wrangler@4
      - name: Inject private KV namespace ID
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path("backend/wrangler.toml")
          content = p.read_text()
          placeholder = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
          if placeholder not in content:
              raise SystemExit("Expected KV namespace placeholder was not found.")
          p.write_text(content.replace(placeholder, os.environ["MG_DATA_KV_ID"]))
          PY
      - name: Deploy Worker and inject secrets in one version
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .wrangler-secrets.json' EXIT
          python - <<'PY'
          import json, os
          from pathlib import Path
          names = [
              "APP_LOGIN_PASSWORD",
              "SESSION_SECRET",
              "OPENAI_API_KEY",
              "META_PAGE_ID",
              "META_PAGE_ACCESS_TOKEN",
              "META_INSTAGRAM_ACCOUNT_ID",
          ]
          secrets = {name: os.environ[name] for name in names if os.environ.get(name)}
          missing = [name for name in names[:2] if name not in secrets]
          if missing:
              raise SystemExit("Missing required Worker secrets: " + ", ".join(missing))
          Path(".wrangler-secrets.json").write_text(json.dumps(secrets))
          Path(".wrangler-secrets.json").chmod(0o600)
          PY
          wrangler deploy --config wrangler.toml --secrets-file .wrangler-secrets.json
