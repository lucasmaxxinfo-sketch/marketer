name: Deploy Marketing Genius API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    env:
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24 for local SQLite runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate backend JavaScript
        run: |
          node --check backend/worker.js
          node --check backend/local/server.mjs\n          node --check backend/local/install.mjs
      - name: Test Worker rules and local SQLite runtime
        run: node --test backend/worker.test.mjs backend/local/server.test.mjs backend/local/install.test.mjs
      - name: Validate local Docker Compose configuration
        run: |
          touch backend/local/.env
          docker compose config --quiet
      - name: Check required deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          MG_DATA_KV_ID: ${{ secrets.MG_DATA_KV_ID || vars.MG_DATA_KV_ID }}
          APP_LOGIN_PASSWORD: ${{ secrets.APP_LOGIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MG_DATA_KV_ID APP_LOGIN_PASSWORD SESSION_SECRET OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Deployment stopped before contacting Cloudflare. Required private settings are incomplete."
            exit 1
          fi
      - name: Inject private KV namespace ID
        env:
          MG_DATA_KV_ID: ${{ secrets.MG_DATA_KV_ID || vars.MG_DATA_KV_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path("backend/wrangler.toml")
          content = p.read_text()
          placeholder = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
          if placeholder not in content:
              raise SystemExit("Expected KV namespace placeholder was not found.")
          p.write_text(content.replace(placeholder, os.environ["MG_DATA_KV_ID"]))
          PY
      - name: Deploy Worker and configure required secrets
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APP_LOGIN_PASSWORD
            SESSION_SECRET
            OPENAI_API_KEY
        env:
          APP_LOGIN_PASSWORD: ${{ secrets.APP_LOGIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Configure Facebook Page ID when supplied
        if: ${{ env.META_PAGE_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: META_PAGE_ID
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}

      - name: Configure Facebook Page access token when supplied
        if: ${{ env.META_PAGE_ACCESS_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: META_PAGE_ACCESS_TOKEN
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}

      - name: Configure Instagram account ID when supplied
        if: ${{ env.META_INSTAGRAM_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: backend
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: META_INSTAGRAM_ACCOUNT_ID
        env:
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
