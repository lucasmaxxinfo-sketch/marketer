name: Temporary trusted-IP gateway probe

on:
  pull_request:
    branches:
      - fix/atomic-login-rate-limit
    paths:
      - .github/workflows/temp-trusted-ip-gateway-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare baseline and spoofed client-IP headers
        shell: bash
        run: |
          set -euo pipefail
          url='https://cyndbisxznohjkxuiyfi.supabase.co/functions/v1/trusted-ip-diagnostic'
          request() {
            name="$1"
            shift
            code="$(curl --silent --show-error --max-time 20 -o "$name.json" -w '%{http_code}' "$@" "$url")"
            echo "--- $name (HTTP $code) ---"
            cat "$name.json"
            echo
          }
          request baseline
          request spoof_cf -H 'CF-Connecting-IP: 198.51.100.77'
          request spoof_xff -H 'X-Forwarded-For: 203.0.113.88'
          request spoof_xreal -H 'X-Real-IP: 192.0.2.66'
          request spoof_all -H 'CF-Connecting-IP: 198.51.100.77' -H 'X-Forwarded-For: 203.0.113.88' -H 'X-Real-IP: 192.0.2.66'
          echo '--- Interpretation ---'
          for name in spoof_cf spoof_xff spoof_xreal spoof_all; do
            code="$(jq -r '.headers.cfConnectingIp // .error // "no-header"' "$name.json" 2>/dev/null || true)"
            echo "$name CF-Connecting-IP / error: $code"
          done
          echo 'A 403 means the gateway rejected the request; it does not reveal which header was overwritten. A successful response reflects the headers that reached the function.'
