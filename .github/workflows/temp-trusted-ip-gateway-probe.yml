name: Temporary trusted-IP gateway probe

on:
  push:
    branches:
      - temp/trusted-ip-gateway-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe isolated Supabase gateway header handling
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 45 \
            'https://cyndbisxznohjkxuiyfi.supabase.co/functions/v1/trusted-ip-diagnostic?mode=probe' \
            | tee gateway-probe.json
          echo
          echo '--- Parsed result ---'
          cat gateway-probe.json
