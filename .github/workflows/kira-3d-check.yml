name: Kira 3D portrait checks

on:
  push:
    branches: [main, refine-kira-3d-avatar]
    paths:
      - 'kira-avatar-3d.js'
      - 'app.js'
      - 'backend/worker.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/kira-3d-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kira-avatar-3d.js'
      - 'app.js'
      - 'backend/worker.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/kira-3d-check.yml'

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check kira-avatar-3d.js
          node --check backend/worker.js
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify Kira portrait on mobile and desktop
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { extname, join, normalize } from 'node:path';
          const root=process.cwd();
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.svg':'image/svg+xml','.json':'application/json','.webmanifest':'application/manifest+json'};
          const server=createServer(async(req,res)=>{
            const pathname=decodeURIComponent(new URL(req.url,'http://127.0.0.1').pathname);
            const file=normalize(join(root,pathname==='/'?'index.html':pathname.slice(1)));
            if(!file.startsWith(root)){res.writeHead(403).end();return}
            try{const body=await readFile(file);res.writeHead(200,{'content-type':mime[extname(file)]||'application/octet-stream','cache-control':'no-store'}).end(body)}
            catch{res.writeHead(404).end('Not found')}
          });
          await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
          const browser=await chromium.launch({headless:true});
          const failures=[];
          for(const viewport of [{width:320,height:700},{width:390,height:844},{width:768,height:1024},{width:1365,height:900}]){
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/?kira3d='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>({
              heading:document.querySelector('.kira-world h1')?.innerText,
              portraitState:document.querySelector('.kira-avatar-3d-canvas')?.dataset.state||'missing',
              threeRevision:window.THREE?.REVISION||null,
              width:document.documentElement.scrollWidth,
              viewportWidth:innerWidth,
              portals:document.querySelectorAll('.dimension-portal').length
            }));
            if(result.heading!=="I’m Kira."||result.portraitState!=="ready"||!result.threeRevision||result.portals!==5||result.width>result.viewportWidth||errors.length){
              failures.push({viewport,result,errors});
            }
            console.log('KIRA_3D_VIEWPORT='+JSON.stringify({viewport,result,errors}));
            await page.locator('.kira-world-actions [data-view="approvals"]').click();
            const approvalUi=await page.evaluate(()=>({
              title:document.querySelector('.kira-present-copy h2')?.innerText,
              activeNav:document.querySelector('.nav-item[data-view="approvals"]')?.getAttribute('aria-current'),
              selectedFilter:document.querySelector('[data-filter="All"]')?.getAttribute('aria-pressed'),
              filterCount:document.querySelectorAll('[data-filter]').length
            }));
            if(approvalUi.title!=="Approval queue"||approvalUi.activeNav!=="page"||approvalUi.selectedFilter!=="true"||approvalUi.filterCount!==3){
              failures.push({viewport,approvalUi});
            }
            await page.locator('[data-filter="Pending"]').click();
            const pendingPressed=await page.locator('[data-filter="Pending"]').getAttribute('aria-pressed');
            if(pendingPressed!=="true") failures.push({viewport,pendingPressed});
            await page.locator('[data-action="kira-home"]').click();
            await page.locator('.kira-world-actions [data-view="studio"]').click();
            const studioTitle=await page.locator('.kira-presentation-body h1').first().innerText();
            if(studioTitle!=="Campaigns") failures.push({viewport,studioTitle});
            console.log('KIRA_UX_VIEWPORT='+JSON.stringify({viewport,approvalUi,pendingPressed,studioTitle}));

            if(viewport.width<760){
              await page.locator('#menu-toggle').click();
              const menuOpened=await page.locator('#menu-toggle').getAttribute('aria-expanded');
              const menuFocus=await page.evaluate(()=>!!document.activeElement?.closest('.sidebar .nav-item'));
              await page.keyboard.press('Escape');
              const menuClosed=await page.locator('#menu-toggle').getAttribute('aria-expanded');
              const menuReturnFocus=await page.evaluate(()=>document.activeElement?.id==='menu-toggle');
              await page.waitForFunction(()=>getComputedStyle(document.querySelector('.sidebar')).visibility==='hidden');
              const menuVisibility=await page.locator('.sidebar').evaluate(el=>getComputedStyle(el).visibility);
              if(menuOpened!=="true"||!menuFocus||menuClosed!=="false"||!menuReturnFocus||menuVisibility!=="hidden") failures.push({viewport,menuOpened,menuFocus,menuClosed,menuReturnFocus,menuVisibility});
            }

            await page.locator('[data-action="new-campaign"]').first().click();
            const dialogLabel=await page.locator('#campaign-dialog').getAttribute('aria-labelledby');
            if(dialogLabel!=="campaign-dialog-title") failures.push({viewport,dialogLabel});
            await page.keyboard.press('Escape');
            if(await page.locator('#campaign-dialog').evaluate(el=>el.open)) failures.push({viewport,dialogDidNotClose:true});
            await page.locator('[data-action="new-campaign"]').first().click();
            await page.locator('#campaign-form input[name="name"]').fill('UX smoke test campaign');
            await page.locator('#campaign-form textarea[name="offer"]').fill('A short test campaign for checking the owner approval journey.');
            await page.locator('#campaign-form button[type="submit"]').click();
            await page.locator('#campaign-dialog').waitFor({state:'hidden'});
            const createdCampaign=await page.locator('.campaign-card h3').filter({hasText:'UX smoke test campaign'}).count();
            if(createdCampaign!==1) failures.push({viewport,createdCampaign});

            async function navigateTo(name){
              await page.locator('#menu-toggle').click();
              await page.locator('.sidebar.menu-open .nav-item[data-view="'+name+'"]').click();
            }
            for(const [name,expected] of [['schedule','Schedule'],['results','Results & Archive'],['connections','Kira’s channel strategy'],['settings','A few useful details']]){
              await navigateTo(name);
              const heading=await page.locator('.kira-presentation-body h1').first().innerText();
              if(heading!==expected) failures.push({viewport,name,heading,expected});
            }
            await page.locator('#settings-form input[name="business"]').fill('UX smoke test business');
            await page.locator('#settings-form button[type="submit"]').click();
            const savedBusiness=await page.evaluate(()=>JSON.parse(localStorage.getItem('mgcc-v1')||'{}').settings?.business);
            if(savedBusiness!=="UX smoke test business") failures.push({viewport,savedBusiness});
            const overflow=await page.evaluate(()=>({documentWidth:document.documentElement.scrollWidth,viewportWidth:innerWidth}));
            if(overflow.documentWidth>overflow.viewportWidth) failures.push({viewport,overflow});
            if(errors.length) failures.push({viewport,errors});
            console.log('KIRA_UX_COMPLETION='+JSON.stringify({viewport,dialogLabel,createdCampaign,savedBusiness,overflow,errors}));
            await page.close();
          }
          await browser.close();
          await new Promise(resolve=>server.close(resolve));
          if(failures.length){console.error(JSON.stringify(failures));process.exit(1)}
          console.log('KIRA_3D_CHECKS_PASSED');
          NODE
