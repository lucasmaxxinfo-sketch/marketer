<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f20b91"><meta name="description" content="Your lively, approval-first marketing command centre."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css"><title>Marketing Genius | Command Centre</title></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-mark">mg<span>✳</span></span><span class="brand-copy"><b>MARKETING GENIUS</b><small>COMMAND CENTRE</small></span></a><p class="nav-label">KIRA’S SPACE</p><nav class="nav-list"><button class="nav-item active" data-view="dashboard"><span>⌂</span> Kira</button><button class="nav-item" data-view="approvals"><span>✓</span> Approval queue <i id="approval-count">0</i></button><button class="nav-item" data-view="studio"><span>✳</span> Documents</button><button class="nav-item" data-view="schedule"><span>▦</span> Schedule</button><button class="nav-item" data-view="results"><span>↗</span> Results & Archive</button><button class="nav-item" data-view="connections"><span>◎</span> Connect channels</button></nav><div class="sidebar-bottom"><button class="nav-item" data-view="connections"><span>◎</span> Channels & access</button><button class="nav-item" data-view="settings"><span>⚙</span> Settings</button></div></aside>
<main class="main"><header class="topbar"><div class="mobile-brand"><span class="brand-mark">mg<span>✳</span></span><b>MARKETING GENIUS · KIRA</b></div><div class="crumb"><b id="page-title">Kira</b></div><div class="top-actions"><button class="btn btn-white menu-toggle" id="menu-toggle" aria-expanded="false">☰ Menu</button></div></header><section id="view-root" class="view-root"></section></main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="campaign-dialog"><form id="campaign-form"><div class="modal-head"><div><p class="eyebrow">LET'S MAKE SOMETHING GOOD</p><h2>Start a campaign</h2></div><button type="button" id="close-dialog" class="close">×</button></div><label>Campaign name<input name="name" required maxlength="90" placeholder="e.g. The good old days"></label><label>What are we talking about?<textarea name="offer" required rows="3" maxlength="500" placeholder="Product, service, event or story"></textarea></label><div class="form-grid"><label>Who is it for?<input name="audience" placeholder="Your regulars, local families…"></label><label>Main goal<select name="goal"><option>Engagement</option><option>Sales</option><option>Leads</option><option>Awareness</option><option>Store visits</option><option>Community growth</option></select></label></div><label>Campaign vibe<select name="angle"><option value="nostalgia">Nostalgia & memories</option><option value="community">Community conversation</option><option value="value">Helpful tips & value</option><option value="behind-scenes">Behind the scenes</option><option value="offer">Offer or promotion</option><option value="story">Customer story</option></select></label><div class="modal-actions"><button type="button" class="btn btn-soft" id="cancel-dialog">Not now</button><button type="submit" class="btn btn-primary">Build my campaign ↗</button></div><p class="fine-print">This creates a draft for your approval. Nothing gets published automatically.</p></form></dialog>
<script src="./app.js" defer></script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
